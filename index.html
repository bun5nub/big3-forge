<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BIG3 FORGE">
<meta name="theme-color" content="#0a0a0b">
<title>BIG3 FORGE ｜ 目標から自動設計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b; --surface:#141414; --elevated:#1d1d1e; --line:#2c2c2e;
  --text:#f4f3ef; --muted:#9b9b97; --faint:#5d5d5a;
  --accent:#f7c21a; --accent-dim:#6e560f; --accent-ink:#1a1400;
  --acc:#4a86d6; --int:#ee7b2b; --del:#5fb85a; --peak:#b56fe0; --test:#ff4d4d;
  --ok:#5fb85a;
  --safe-top:env(safe-area-inset-top); --safe-bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:'Archivo',system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none;}
body{padding-bottom:calc(28px + var(--safe-bot));}
.mono{font-family:'DM Mono',ui-monospace,monospace;}

/* ---- Header ---- */
header{position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,#0a0a0b 72%,rgba(10,10,11,.92));
  padding:calc(12px + var(--safe-top)) 16px 0;border-bottom:2px solid var(--accent);
  backdrop-filter:blur(8px);}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:center;gap:11px;min-width:0;}
.emblem{width:44px;height:44px;flex:none;border:2px solid var(--accent);border-radius:12px;
  display:flex;align-items:center;justify-content:center;color:var(--accent);}
.logo{font-family:'Anton',sans-serif;font-weight:400;font-size:26px;letter-spacing:1.2px;line-height:.92;text-transform:uppercase;}
.logo b{color:var(--accent);font-weight:400;}
.goal{font-family:'DM Mono';font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.4px;}
.goal s{color:var(--accent);text-decoration:none;font-weight:500;}
.ring{position:relative;width:52px;height:52px;flex:none;}
.ring svg{transform:rotate(-90deg);}
.ringpct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'DM Mono';font-size:12px;font-weight:500;color:var(--text);}
.savetag{font-size:10px;color:var(--faint);}
.barmeta{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--muted);}
.barmeta .count{font-family:'DM Mono';color:var(--text);font-weight:500;}

/* ---- Lift tabs ---- */
.tabs{display:flex;gap:6px;margin-top:12px;}
.tab{flex:1;background:transparent;border:none;border-bottom:3px solid transparent;
  color:var(--muted);font-family:'Anton',sans-serif;font-size:15px;letter-spacing:.6px;
  padding:9px 4px 10px;cursor:pointer;text-transform:uppercase;transition:.15s;}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);}

/* ---- Setup card ---- */
.setup{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:12px 12px 0;padding:13px 14px;}
.setup .lbl{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.5px;margin-bottom:9px;text-transform:uppercase;}
.inrow{display:flex;gap:10px;}
.infield{flex:1;}
.infield span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
.infield .u{font-size:10px;color:var(--faint);}
.numin{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
  font-family:'DM Mono';font-size:18px;font-weight:500;border-radius:9px;padding:9px 10px;text-align:center;}
.numin.tgt{border-color:var(--accent-dim);color:var(--accent);}
.feasib{font-size:11.5px;line-height:1.5;margin-top:10px;border-radius:9px;padding:8px 10px;}
.feasib.ok{color:var(--ok);background:rgba(95,184,90,.10);}
.feasib.warn{color:var(--int);background:rgba(238,123,43,.12);}
.feasib.bad{color:var(--test);background:rgba(255,77,77,.12);}
.moderow{display:flex;gap:6px;margin-bottom:11px;}
.modebtn{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--muted);
  font-family:inherit;font-size:11.5px;font-weight:700;padding:8px 4px;border-radius:9px;cursor:pointer;}
.modebtn.on{background:var(--elevated);border-color:var(--accent-dim);color:var(--accent);}
.freqrow{display:flex;align-items:center;gap:8px;margin-top:10px;}
.freqrow span{font-size:11px;color:var(--muted);}
.freqseg{display:flex;gap:4px;}
.freqseg button{background:var(--bg);border:1px solid var(--line);color:var(--muted);
  font-family:'DM Mono';font-size:12px;width:34px;padding:6px 0;border-radius:8px;cursor:pointer;}
.freqseg button.on{background:var(--accent);border-color:var(--accent);color:#170a05;font-weight:700;}
.arbanner{display:flex;align-items:center;gap:8px;font-size:11.5px;line-height:1.45;margin-top:10px;
  border-radius:9px;padding:8px 10px;color:var(--peak);background:rgba(181,111,224,.12);}
.arbanner button{margin-left:auto;flex:none;background:transparent;border:1px solid var(--peak);
  color:var(--peak);font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:7px;cursor:pointer;}
.sched{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:12px 12px 0;padding:12px 14px;}
.sched .lbl{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.5px;margin-bottom:9px;text-transform:uppercase;}
.schedgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.schedgrid .d{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 2px;text-align:center;min-height:54px;}
.schedgrid .d .dn{font-size:10px;color:var(--faint);margin-bottom:4px;}
.schedgrid .d .pill{display:block;font-size:10px;font-weight:700;border-radius:5px;padding:2px 0;margin:2px 1px;color:#0a0a0b;}
.schedgrid .d .rest{font-size:10px;color:var(--faint);margin-top:8px;}
.schedwarn{font-size:11.5px;line-height:1.5;margin-top:10px;border-radius:9px;padding:8px 10px;}
.schedwarn.ok{color:var(--ok);background:rgba(95,184,90,.10);}
.schedwarn.warn{color:var(--int);background:rgba(238,123,43,.12);}
.schedwarn.bad{color:var(--test);background:rgba(255,77,77,.12);}
.today{background:linear-gradient(135deg,#1a1709,var(--surface));border:1px solid var(--accent-dim);
  border-radius:14px;margin:12px 12px 0;padding:13px 14px;cursor:pointer;}
.today:active{background:var(--elevated);}
.today .thead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.today .tt{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.6px;text-transform:uppercase;}
.today .tgo{font-size:11px;color:var(--accent);border:1px solid var(--accent-dim);border-radius:7px;padding:3px 9px;white-space:nowrap;}
.today .tsub{font-size:13px;font-weight:700;line-height:1.3;}
.today .tph{font-size:10.5px;color:var(--muted);margin-top:2px;}
.today .titem{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-top:7px;
  padding-top:7px;border-top:1px solid var(--line);}
.today .titem .nm{color:var(--text);min-width:0;}
.today .titem .wt{font-family:'DM Mono';color:var(--accent);white-space:nowrap;}
.today .titem.dn .nm{color:var(--faint);text-decoration:line-through;}
.today .tnone{font-size:12.5px;color:var(--del);font-weight:700;}

/* ---- Toolbar ---- */
.tools{display:flex;gap:8px;padding:12px 16px 4px;flex-wrap:wrap;}
.tbtn{flex:1;min-width:84px;background:var(--surface);border:1px solid var(--line);
  color:var(--text);font-family:inherit;font-size:12px;font-weight:600;
  padding:10px 8px;border-radius:11px;cursor:pointer;text-align:center;}
.tbtn:active{background:var(--elevated);}
.tbtn.go{background:var(--accent);border-color:var(--accent);color:#170a05;}
.tbtn.book{background:var(--elevated);border-color:var(--accent-dim);color:var(--accent);}

.legend{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 4px;}
.lg{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;}
.lg i{width:9px;height:9px;border-radius:3px;display:inline-block;}

/* ---- Week card ---- */
main{padding:8px 12px;}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  margin:10px 0;overflow:hidden;border-left:4px solid var(--phase);}
.wkhead{display:flex;align-items:center;gap:10px;padding:15px 14px;cursor:pointer;}
.wkhead .ttl{flex:1;min-width:0;}
.wkhead .lab{font-weight:800;font-size:14.5px;line-height:1.25;}
.wkhead .phase{font-size:10.5px;color:var(--phase);font-weight:700;letter-spacing:.4px;margin-top:2px;}
.wkprog{font-family:'DM Mono';font-size:12px;color:var(--muted);white-space:nowrap;}
.wkprog.done{color:var(--ok);}
.chev{color:var(--faint);font-size:13px;transition:transform .25s;}
.wk.open .chev{transform:rotate(90deg);}
.wk.alldone{border-left-color:var(--ok);}
.wk.alldone .wkhead .lab::after{content:" ✓";color:var(--ok);}

.wkbody{display:none;padding:0 14px 14px;}
.wk.open .wkbody{display:block;animation:fade .25s;}
@keyframes fade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;}}
.intro{font-size:12px;color:var(--muted);line-height:1.5;background:var(--elevated);
  border-radius:10px;padding:9px 11px;margin-bottom:12px;}

/* ---- Day ---- */
.day{margin-top:14px;}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.dayname{font-weight:700;font-size:13px;color:var(--text);}
.dateinp{background:var(--elevated);border:1px solid var(--line);color:var(--text);
  font-family:'DM Mono';font-size:12px;border-radius:9px;padding:7px 9px;min-width:140px;}
.dateinp::-webkit-date-and-time-value{text-align:left;}

.ex{display:flex;align-items:flex-start;gap:11px;padding:11px 4px;border-top:1px solid var(--line);}
.ex:first-of-type{border-top:none;}
.chk{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--faint);
  margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.15s;background:transparent;}
.chk svg{width:15px;height:15px;stroke:#170a05;stroke-width:3.5;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0;}
.ex.done .chk{background:var(--accent);border-color:var(--accent);}
.ex.done .chk svg{opacity:1;}
.exmain{flex:1;min-width:0;}
.exname{font-size:13.5px;font-weight:600;line-height:1.3;}
.ex.done .exname{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent-dim);}
.exnums{font-family:'DM Mono';font-size:12.5px;color:var(--accent);margin-top:3px;}
.exnums .lt{color:var(--muted);}
.exnums.speed{color:var(--int);}
.exnums.warm{color:var(--muted);}
.rpe{flex:none;font-family:'DM Mono';font-size:11px;font-weight:500;color:var(--muted);
  border:1px solid var(--line);border-radius:7px;padding:3px 6px;margin-top:1px;white-space:nowrap;}
.actual{margin-top:6px;}
.actual input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
  font-family:'DM Mono';font-size:12px;border-radius:8px;padding:6px 9px;}
.actual input::placeholder{color:var(--faint);}
.actual select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
  font-family:'Archivo',sans-serif;font-size:12.5px;border-radius:8px;padding:8px 9px;}
.reco{font-size:11.5px;margin-top:6px;border-radius:8px;padding:7px 9px;line-height:1.45;}
.reco.ok{color:var(--ok);background:rgba(95,184,90,.10);}
.reco.up{color:var(--accent);background:rgba(247,194,26,.12);}
.reco.down{color:var(--test);background:rgba(255,77,77,.12);}
.suggest{display:inline-block;margin-left:8px;font-size:10.5px;color:var(--accent);
  border:1px dashed var(--accent-dim);border-radius:6px;padding:1px 6px;font-family:'Archivo',sans-serif;}
.memo{font-size:11.5px;color:var(--faint);line-height:1.5;margin-top:11px;
  padding-left:11px;border-left:2px solid var(--line);}
.rest .exnums{display:none;}

.note{font-size:11px;color:var(--faint);text-align:center;padding:22px 24px;line-height:1.6;}
.note a{color:var(--muted);}
#file{display:none;}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-bot));transform:translateX(-50%) translateY(20px);
  background:var(--accent);color:#170a05;font-weight:700;font-size:13px;padding:10px 20px;border-radius:30px;
  opacity:0;transition:.3s;z-index:100;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---- 種目説明 (info sheet) ---- */
.exname.tappable{cursor:pointer;}
.exname .info{display:inline-block;margin-left:7px;font-size:10.5px;color:var(--accent);
  border:1px solid var(--accent-dim);border-radius:6px;padding:1px 6px;vertical-align:middle;font-weight:600;white-space:nowrap;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.25s;z-index:200;}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:201;background:var(--surface);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:16px 18px calc(28px + var(--safe-bot));max-height:84vh;overflow-y:auto;
  transform:translateY(101%);transition:.28s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch;}
.sheet.show{transform:translateY(0);}
.sheet .grip{width:42px;height:4px;border-radius:3px;background:var(--line);margin:2px auto 14px;}
.sheet .close{position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  background:var(--elevated);color:var(--text);font-size:17px;line-height:1;cursor:pointer;}
.sheet h3{margin:2px 40px 2px 0;font-size:18px;font-weight:800;line-height:1.3;}
.sheet .diff{color:var(--muted);font-size:12.5px;line-height:1.5;margin:6px 0 4px;}
.sheet h4{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.6px;margin:16px 0 6px;}
.sheet ol{margin:0;padding-left:20px;}
.sheet ol li{font-size:13.5px;line-height:1.6;margin-bottom:6px;}
.sheet .box{font-size:13px;line-height:1.55;background:var(--elevated);border-radius:10px;padding:10px 12px;}
.sheet .box.warn{border-left:3px solid var(--test);}
.sheet .box.aim{border-left:3px solid var(--accent);}
.idxbtn{display:block;width:100%;text-align:left;background:var(--elevated);border:1px solid var(--line);
  color:var(--text);font-family:inherit;font-size:14px;font-weight:700;padding:13px 14px;border-radius:11px;margin-bottom:8px;cursor:pointer;}
.idxbtn small{display:block;color:var(--muted);font-weight:400;font-size:11.5px;margin-top:3px;}
/* ---- v2 追加分 ---- */
.dateinp{min-width:0;width:128px;}
.datewrap{display:flex;align-items:center;gap:6px;flex:none;}
.todaybtn{flex:none;background:var(--elevated);border:1px solid var(--accent-dim);color:var(--accent);
  font-family:inherit;font-size:11.5px;font-weight:700;border-radius:9px;padding:8px 10px;cursor:pointer;}
.todaybtn[disabled]{border-color:var(--line);color:var(--faint);cursor:default;}
.weakrow{margin-top:10px;}
.weakrow .wl{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;}
.weakrow select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
  font-family:'Archivo',sans-serif;font-size:12.5px;border-radius:8px;padding:8px 9px;}
.weakfx{font-size:10.5px;color:var(--faint);margin-top:5px;line-height:1.45;}
.estbanner{font-size:11.5px;line-height:1.5;margin-top:10px;border-radius:9px;padding:8px 10px;}
.estbanner b{font-size:12px;}
.estbanner .sub{opacity:.75;font-size:10.5px;}
.estbanner.early{color:var(--peak);background:rgba(181,111,224,.12);}
.estbanner.ok{color:var(--ok);background:rgba(95,184,90,.10);}
.estbanner.bad{color:var(--test);background:rgba(255,77,77,.12);}
.arbanner{align-items:flex-start;}
.arbanner .att{font-family:'DM Mono',ui-monospace,monospace;font-size:11px;opacity:.85;}
.restoretxt{width:100%;height:130px;margin-top:12px;background:var(--bg);border:1px solid var(--line);color:var(--text);
  font-family:'DM Mono',ui-monospace,monospace;font-size:11px;border-radius:10px;padding:9px 10px;resize:vertical;}
.rrow{display:flex;gap:8px;margin-top:10px;}
.tbtn.wide{display:block;width:100%;margin-top:12px;}
.rtable{width:100%;border-collapse:collapse;font-size:12px;}
.rtable th{color:var(--muted);font-weight:600;font-size:10.5px;text-align:left;padding:4px 4px;border-bottom:1px solid var(--line);}
.freqseg{align-items:center;}
/* 週を開いたとき、固定ヘッダーの下に週の見出しが隠れないようにする */
.wk{scroll-margin-top:calc(150px + var(--safe-top));}
.rtable td{font-family:'DM Mono',ui-monospace,monospace;padding:7px 4px;border-bottom:1px solid var(--line);}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand">
      <div class="emblem" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="6" y1="13" x2="20" y2="13"/>
          <rect x="2.5" y="9" width="3.2" height="8" rx="1.2" fill="currentColor" stroke="none"/>
          <rect x="20.3" y="9" width="3.2" height="8" rx="1.2" fill="currentColor" stroke="none"/>
          <line x1="7.5" y1="10.5" x2="7.5" y2="15.5"/>
          <line x1="18.5" y1="10.5" x2="18.5" y2="15.5"/>
        </svg>
      </div>
      <div>
        <div class="logo" id="logo">BIG3 <b id="liftname">BENCH</b></div>
        <div class="goal"><span id="dispcur">115</span> → <s id="disptgt">120 KG</s></div>
      </div>
    </div>
    <div class="ring">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="21" fill="none" stroke="var(--elevated)" stroke-width="5"/>
        <circle id="ringfill" cx="26" cy="26" r="21" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="131.9" stroke-dashoffset="131.9" style="transition:stroke-dashoffset .45s ease"/>
      </svg>
      <span class="ringpct" id="pctlabel">0%</span>
    </div>
  </div>
  <div class="barmeta">
    <span><span class="count" id="countlabel">0/0</span> 完了</span>
    <span class="savetag" id="savetag">✓ 自動保存</span>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="setup">
  <div class="moderow">
    <button class="modebtn" id="mode-focus" onclick="setMode('focus')">1種目に集中</button>
    <button class="modebtn" id="mode-concurrent" onclick="setMode('concurrent')">BIG3を並行</button>
  </div>
  <div class="lbl" id="setuplbl">ベンチプレス｜目標設定</div>
  <div class="inrow">
    <label class="infield"><span>現在の最大 <i class="u">1RM kg</i></span>
      <input class="numin" id="curin" type="number" inputmode="decimal" step="1.25" onchange="setCfg('cur',this.value)"></label>
    <label class="infield"><span>目標 <i class="u">kg</i></span>
      <input class="numin tgt" id="tgtin" type="number" inputmode="decimal" step="1.25" onchange="setCfg('tgt',this.value)"></label>
  </div>
  <div class="freqrow"><span>週の頻度</span><div class="freqseg" id="freqseg"></div></div>
  <div class="freqrow"><span>重量の刻み</span><div class="freqseg" id="stepseg"></div></div>
  <div class="weakrow">
    <span class="wl" id="weaklbl">弱点</span>
    <select id="weaksel" onchange="setWeak(this.value)"></select>
    <div class="weakfx" id="weakfx"></div>
  </div>
  <div class="feasib" id="feasib"></div>
  <div id="estbanner"></div>
  <div id="arbanner"></div>
</div>
<div class="sched" id="sched" style="display:none">
  <div class="lbl">推奨 週スケジュール</div>
  <div class="schedgrid" id="schedgrid"></div>

   BIG3 FORGE Web版（v2）
   - プログラム表・種目名・解説（上の DATA）は iOS版 Program.swift / Explain.swift から自動変換。
   - 計算は iOS版 Logic/Calc.swift と同一（重量計算・自動補正・刻み）。
   ===================================================================== */
const C={acc:'var(--acc)',int:'var(--int)',del:'var(--del)',peak:'var(--peak)',test:'var(--test)'};
const {RPE_ROWS,PROG,TPL,LIFTMETA,WEAK_REMAP,EXPLAIN,WARMUP_EX,REST_EX}=DATA;
const LIFTS=["bench","squat","deadlift"];
const WEAKS=["balanced","bottom","mid","lockout"];
const WEAK_JP={balanced:"標準（弱点を指定しない）",bottom:"ボトム（一番下から動かない）",
  mid:"ミッドレンジ（途中で止まる）",lockout:"ロックアウト（最後に押し／引き切れない）"};
// 種目タプル: [role, pct(コンペ基準), reps, sets, rpe, kind, label?]  kind: 0=休養 1=本セット 2=スピード 3=ウォームアップ
const RPE_ASC=RPE_ROWS.slice().sort((a,b)=>a[0]-b[0]);

/* ===== 計算（iOS版 Calc.swift と同一） ===== */
// RPE(=RIR)×レップ → 1RM比（RTS表。表外のRPEは近い行で丸め）
function rpePct(reps,rpe){
  if(!(reps>=1))return null;
  const r=Math.min(Math.max(reps,1),10);
  let best=null;
  for(const row of RPE_ASC){if(best===null||Math.abs(row[0]-rpe)<Math.abs(best[0]-rpe))best=row;}
  return best?best[1][r-1]:null;
}
function e1RM(weight,reps,rpe){const p=rpePct(reps,rpe);return (p&&p>0)?weight/p:null;}
// 1.25kg単位（1RMの入力値・推定1RMなど「バーに付けない重量」用）
function round125(x){return Math.round(x/1.25)*1.25;}
// 重量の刻み：2.5kg = 1.25kgプレートを左右に1枚ずつ / 1.25kg = 端数プレートがあるジム
const PLATE_STEPS=[2.5,1.25], DEFAULT_PLATE_STEP=2.5;
function plateStep(st){const v=st&&st.step;return PLATE_STEPS.includes(v)?v:DEFAULT_PLATE_STEP;}
function roundStep(x,step){return Math.round(x/step)*step;}
function floorStep(x,step){return Math.floor(x/step+1e-9)*step;}

const FELT={1:5,2:6.5,3:8,4:9,5:10};
function rpeValue(r){return parseFloat(String(r||'').replace('RPE',''));}
// 申告の分解能は約±0.5RPE。画面の判定と自動補正は必ずこの同じ基準を使う
const FEEL_DEADBAND=0.5, LEARN_MIN_RPE=7.0;
// +1=処方より楽 / 0=処方どおり / -1=処方より重い / null=判定不可
function feelDirection(sel,tRPE){
  const felt=FELT[sel]; if(felt===undefined||isNaN(tRPE))return null;
  const diff=felt-tRPE; if(Math.abs(diff)<=FEEL_DEADBAND)return 0;
  return diff<0?1:-1;
}
// 申告1件から読み取れる「実力 ÷ 処方時の基準max」（1.0=処方どおり）
function impliedRatio(l,sel){
  if(l[5]!==1)return null;
  const tR=rpeValue(l[4]); if(isNaN(tR)||tR<LEARN_MIN_RPE)return null;
  const dir=feelDirection(sel,tR); if(dir===null)return null;
  if(dir===0)return 1.0;
  const pF=rpePct(l[2],FELT[sel]), pT=rpePct(l[2],tR);
  if(!pF||!pT||pF<=0)return null;
  return pT/pF;
}
// 直近8件の平均で係数を決める（積算すると複利で上限/下限に張り付くため）
const AR_WINDOW=8, AR_DAMP=0.7;
function factorFrom(ratios){
  if(!ratios.length)return 1;
  const rec=ratios.slice(-AR_WINDOW);
  const mean=rec.reduce((a,b)=>a+b,0)/rec.length;
  const f=1+(mean-1)*AR_DAMP;
  return Math.round(Math.max(0.93,Math.min(1.07,f))*1000)/1000;
}
function roleAdj(lift,role){const a=LIFTMETA[lift].adj[role];return a===undefined?1:a;}
function tunedRole(role,lift,w){const m=(WEAK_REMAP[lift]||{})[w];return (m&&m[role])||role;}
function tunedItem(l,lift,w){const r=tunedRole(l[0],lift,w);if(r===l[0])return l;const c=l.slice();c[0]=r;return c;}
function weakOf(st,lift){const w=st.cfg[lift].weak;return WEAKS.includes(w)?w:'balanced';}
// 実測 → 週ごとの補正係数
//  ・週wiの係数は「wiより前の週の記録」だけで決まる（その週の途中で記録しても同じ週の重量は変わらない）
//  ・各記録には実際に挙げた重量にかかっていた係数を掛け戻して「実力 ÷ 計画」に換算する
function autoRegulate(lift,weak,actuals,stamp){
  const weekFactors=[],ratios=[],entries=[]; let last=-1;
  TPL.forEach((wk,wi)=>{
    const f=factorFrom(ratios); weekFactors.push(f);
    wk.days.forEach((d,di)=>d.lifts.forEach((l0,li)=>{
      const l=tunedItem(l0,lift,weak);
      const raw=actuals[`${lift}_${wi}_${di}_${li}`]; if(raw===undefined)return;
      const sel=parseInt(raw,10); if(isNaN(sel))return;
      const r=impliedRatio(l,sel); if(r===null)return;
      const before=factorFrom(ratios); ratios.push(r*f); const after=factorFrom(ratios);
      last=Math.max(last,wi);
      entries.push({lift,week:wi,day:di,exercise:l[0],feel:sel,targetRpe:rpeValue(l[4]),
        factorBefore:before,factorAfter:after,createdAt:stamp||''});
    }));
  });
  return {weekFactors,final:factorFrom(ratios),lastLog:last,entries};
}
function prescribedWeight(c,lift,wi,pct,role,factor,step){
  const ref=c.cur+(c.tgt-c.cur)*PROG[wi];
  return roundStep(ref*pct*roleAdj(lift,role)*factor,step);
}

const KEY="big3_v2";
const MINW=20, MAXW=500;
const ID_RE=/^(bench|squat|deadlift)_\d{1,2}_\d_\d{1,2}$/, DAY_RE=/^(bench|squat|deadlift)_\d{1,2}_\d$/, DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
function defCfg(k){return {cur:LIFTMETA[k].cur,tgt:LIFTMETA[k].tgt,freq:LIFTMETA[k].freq,tmFactor:1,lastLog:-1};}
function freshState(){const s={version:2,mode:"concurrent",lift:"bench",cfg:{},dates:{},checks:{},actuals:{},adjustments:[],open:0};
  LIFTS.forEach(k=>{s.cfg[k]=defCfg(k);});return s;}
function clampN(v,min,max,def){const n=typeof v==='number'?v:parseFloat(v);return (isNaN(n)||n<min||n>max)?def:n;}
const isObj=o=>!!o&&typeof o==='object'&&!Array.isArray(o);
/* 任意のオブジェクト（iOS版のバックアップを含む）を安全なStateへ正規化 */
function sanitize(raw){
  const s=freshState(); if(!isObj(raw))return s;
  s.mode=(raw.mode==='focus'||raw.mode==='concurrent')?raw.mode:'concurrent';
  s.lift=LIFTS.includes(raw.lift)?raw.lift:'bench';
  s.open=Number.isInteger(raw.open)?raw.open:0;
  if(isObj(raw.dates))Object.entries(raw.dates).forEach(([k,v])=>{if(DAY_RE.test(k)&&typeof v==='string'&&DATE_RE.test(v))s.dates[k]=v;});
  if(isObj(raw.checks))Object.entries(raw.checks).forEach(([k,v])=>{if(ID_RE.test(k)&&v===true)s.checks[k]=true;});
  if(isObj(raw.actuals))Object.entries(raw.actuals).forEach(([k,v])=>{if(ID_RE.test(k)&&/^[1-5]$/.test(String(v)))s.actuals[k]=String(v);});
  if(Array.isArray(raw.adjustments))s.adjustments=raw.adjustments.filter(isObj).slice(-200);
  ['theme','accent'].forEach(k=>{if(typeof raw[k]==='string')s[k]=raw[k];});
  if(PLATE_STEPS.includes(raw.step))s.step=raw.step;
  if(isObj(raw.cfg))LIFTS.forEach(k=>{const c=raw.cfg[k]; if(!isObj(c))return; const d=s.cfg[k];
    d.cur=clampN(c.cur,MINW,MAXW,d.cur);
    d.tgt=clampN(c.tgt,MINW,MAXW,d.tgt);
    d.freq=[1,2,3].includes(c.freq)?c.freq:d.freq;
    d.tmFactor=clampN(c.tmFactor,0.93,1.07,1);
    d.lastLog=Number.isInteger(c.lastLog)?c.lastLog:-1;
    if(WEAKS.includes(c.weak)&&c.weak!=='balanced')d.weak=c.weak;});
  return s;
}
let S;
try{const r=localStorage.getItem(KEY); S=r?sanitize(JSON.parse(r)):freshState();}catch(e){S=freshState();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function cfg(){return S.cfg[S.lift];}
function weakness(){return weakOf(S,S.lift);}
function weightStep(){return plateStep(S);}
function liftsOf(wi,di){const w=weakness();return TPL[wi].days[di].lifts.map(l=>tunedItem(l,S.lift,w));}
function weekFactors(){return autoRegulate(S.lift,weakness(),S.actuals).weekFactors;}
function weightOf(wi,l,wf){return prescribedWeight(cfg(),S.lift,wi,l[1],l[0],(wf||weekFactors())[wi],weightStep());}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(w){const r=Math.round(w*100)/100; if(Number.isInteger(r))return String(r);
  let s=r.toFixed(2); while(s.endsWith('0'))s=s.slice(0,-1); if(s.endsWith('.'))s=s.slice(0,-1); return s;}

// 補正係数・最終記録週・履歴（表示用）を計算し直す。重量自体は毎回 actuals から計算する
function rebuildTM(k,onlyIfChanged){
  const c=S.cfg[k];
  const t=autoRegulate(k,weakOf(S,k),S.actuals,new Date().toISOString());
  if(onlyIfChanged&&c.tmFactor===t.final&&c.lastLog===t.lastLog)return false;
  c.tmFactor=t.final; c.lastLog=t.lastLog;
  S.adjustments=S.adjustments.filter(a=>a.lift!==k).concat(t.entries);
  if(S.adjustments.length>200)S.adjustments=S.adjustments.slice(-200);
  return true;
}
// 読み込んだデータ（iOS版の旧ロジックで保存された係数を含む）を現行ロジックで揃える
function migrateTM(){let ch=false;LIFTS.forEach(k=>{if(rebuildTM(k,true))ch=true;});return ch;}
if(migrateTM())save();

/* 並行モードで実施する曜日を頻度から決める(テスト週は常に全日) */
function activeDays(wk){if(wk.days.length<=1)return wk.days.map((d,di)=>({d,di}));
  return wk.days.map((d,di)=>({d,di})).filter(x=>x.di<cfg().freq);}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ===== 判定・推定（iOS版 Derived.swift と同一） ===== */
function feasibility(){
  const c=cfg(),cur=c.cur,tgt=c.tgt;
  if(tgt<=cur)return {level:'warn',text:'目標が現在値以下です。目標を現在値より上に設定してください。'};
  const gain=tgt-cur,pct=gain/cur*100,perMonth=gain/3; let level,msg;
  if(pct<=3){level='ok';msg='余裕のある目標。1サイクルで到達し、次サイクルの土台も作れます。';}
  else if(pct<=6){level='ok';msg='中級者が12週で狙える上限に近い伸び幅。W10の予行シングルが上がるかで判断してください。';}
  else if(pct<=12){level='warn';msg='攻めた目標。到達には栄養・睡眠・体重増が前提。未達でも推定1RMが伸びていればサイクルは成功です。';}
  else if(pct<=20){level='warn';msg='12週では大きすぎる可能性が高い。中間目標を置き、2サイクルに分けるのが安全です。';}
  else{level='bad';msg='1サイクルでは非現実的。まず現在値+5〜8%を目標にしてください。';}
  const perM=Math.round(perMonth*10)/10;
  return {level,text:`+${fmt(gain)}kg（+${pct.toFixed(1)}%／約${fmt(perM)}kg/月）\n${msg}`};
}
// 直近の実測（目標RPE7以上の本セット）から推定1RMを逆算。種目差は adj でコンペ換算に戻す
function bestE1RM(wfIn){
  const wf=wfIn||weekFactors(),w=weakness(),c=cfg(),m=LIFTMETA[S.lift]; let latest=null;
  TPL.forEach((wk,wi)=>wk.days.forEach((d,di)=>d.lifts.forEach((l0,li)=>{
    const l=tunedItem(l0,S.lift,w); if(l[5]!==1)return;
    const tR=rpeValue(l[4]); if(isNaN(tR)||tR<LEARN_MIN_RPE)return;
    const raw=S.actuals[`${S.lift}_${wi}_${di}_${li}`]; if(raw===undefined)return;
    const felt=FELT[parseInt(raw,10)]; if(felt===undefined)return;
    const wt=prescribedWeight(c,S.lift,wi,l[1],l[0],wf[wi],weightStep());
    const e=e1RM(wt,l[2],felt); if(e===null)return;
    const adj=roleAdj(S.lift,l[0]); if(!(adj>0))return;
    const pos=wi*1000+di*100+li;
    if(!latest||pos>latest.pos){const nm=l[6]||m.names[l[0]]||l[0];
      latest={pos,value:e/adj,from:`W${wi+1} ${nm} ${fmt(wt)}kg×${l[2]}`,wi,reps:l[2]};}
  })));
  if(!latest)return null;
  const v=round125(latest.value);
  return {e1rm:v,from:latest.from,gap:v-c.tgt,week:latest.wi,reps:latest.reps};
}
function arInfo(est){
  const c=cfg(); if(c.tmFactor===1&&c.lastLog<0)return null;
  const p=(c.tmFactor-1)*100, proj=round125(c.tgt*c.tmFactor);
  const wk=c.lastLog>=0?`Week ${c.lastLog+1}`:'—';
  const last=[...S.adjustments].reverse().find(a=>a.lift===S.lift);
  const dir=last?(last.factorAfter>=last.factorBefore?'楽だった→強度UP':'重かった→強度DOWN'):'';
  const basis=est?est.e1rm:proj, st=weightStep();
  // 推奨試技は実際にバーに付ける重量なので刻みに合わせ、推定を超えないよう切り下げる
  return {percent:p,projected:proj,weekLabel:wk,dir,
    attempts:{o:floorStep(basis*0.907,st),s:floorStep(basis*0.955,st),t:floorStep(basis,st)}};
}
// 今日の日付が入った日 → なければ最初の未完了日（休養のみの日は完了扱い）
function todayPick(){
  const td=todayStr(); let hit=null,first=null;
  TPL.forEach((wk,wi)=>activeDays(wk).forEach(({d,di})=>{
    const work=d.lifts.map((l,li)=>({l,li})).filter(x=>x.l[0]!=='rest');
    const allDone=work.every(x=>S.checks[`${S.lift}_${wi}_${di}_${x.li}`]);
    if(S.dates[`${S.lift}_${wi}_${di}`]===td&&!hit)hit={wi,di,isToday:true};
    if(!allDone&&!first)first={wi,di,isToday:false};
  }));
  return hit||first;
}

const app=document.getElementById('app');
const FEEL=[['','— 何回残せたか記録 —'],['1','あと5回以上いけた（RPE5）'],['2','あと3〜4回いけた（RPE6.5）'],
  ['3','あと2回いけた（RPE8）'],['4','あと1回いけた（RPE9）'],['5','もう1回も上がらない（RPE10）']];
// 判定は自動補正と同じ feelDirection（±0.5RPE）を使い、表示と実際の補正を一致させる
function recoHtml(sel,rpe){
  const feel=parseInt(sel,10); if(isNaN(feel))return '';
  const tR=rpeValue(rpe), dir=feelDirection(feel,tR); if(dir===null)return '';
  const heavy=(FELT[feel]-tR>1.5)?'重すぎ':'やや重い';
  if(dir===0)return `<div class="reco ok">✓ 狙い通り（RPE${fmt(tR)}）→ 現状維持でOK</div>`;
  if(tR>=LEARN_MIN_RPE)return dir>0?`<div class="reco up">▲ 軽め → 次の週から重量を上げます</div>`
    :`<div class="reco down">▼ ${heavy} → 次の週から重量を下げます・無理は禁物</div>`;
  return dir>0?`<div class="reco up">▲ 軽め（デロード週は自動補正の対象外）</div>`
    :`<div class="reco down">▼ ${heavy}：疲労が残っているサイン（デロード週は自動補正の対象外）</div>`;
}
function render(){
  const m=LIFTMETA[S.lift],c=cfg(),wf=weekFactors(),td=todayStr();
  document.getElementById('liftname').textContent=m.short;
  document.getElementById('dispcur').textContent=fmt(c.cur);
  document.getElementById('disptgt').textContent=fmt(c.tgt)+' KG';
  document.getElementById('setuplbl').textContent=m.jp+'｜目標設定';
  document.getElementById('curin').value=fmt(c.cur);
  document.getElementById('tgtin').value=fmt(c.tgt);
  document.getElementById('mode-focus').classList.toggle('on',S.mode==='focus');
  document.getElementById('mode-concurrent').classList.toggle('on',S.mode==='concurrent');
  renderTabs(); renderFreq(); renderStep(); renderWeak(); renderFeasib(); renderEstAR(wf); renderSched(); renderToday(wf);

  app.innerHTML='';
  TPL.forEach((wk,wi)=>{
    const days=activeDays(wk);
    const ids=[]; days.forEach(({d,di})=>d.lifts.forEach((l,li)=>{if(l[0]!=='rest')ids.push(`${S.lift}_${wi}_${di}_${li}`);}));
    const done=ids.filter(id=>S.checks[id]).length, tot=ids.length, all=done===tot&&tot>0;
    const card=document.createElement('div');
    card.className='wk'+(S.open===wi?' open':'')+(all?' alldone':'');
    card.style.setProperty('--phase',C[wk.color]);
    let body=`<div class="intro">${wk.intro}</div>`;
    days.forEach(({d,di})=>{
      const dkey=`${S.lift}_${wi}_${di}`, dv=S.dates[dkey]||'';
      body+=`<div class="day"><div class="dayhead"><span class="dayname">${d.n}</span><div class="datewrap">`+
        `<input class="dateinp" type="date" value="${esc(dv)}" onchange="setDate('${dkey}',this.value)">`+
        `<button class="todaybtn" onclick="setDate('${dkey}',todayStr())"${dv===td?' disabled':''}>今日</button></div></div>`;
      liftsOf(wi,di).forEach((l,li)=>{
        const id=`${S.lift}_${wi}_${di}_${li}`, ck=!!S.checks[id];
        const [role,pct,reps,sets,rpe,kind,labOv]=l;
        const name=labOv||m.names[role]||role;
        const w=kind===0?0:weightOf(wi,l,wf);
        let nums='';
        if(kind===3)nums=`<div class="exnums warm">${fmt(w)}<span class="lt">kg ×${reps}</span></div>`;
        else if(kind===2)nums=`<div class="exnums speed">${fmt(w)}<span class="lt">kg × ${reps}回 × ${sets}set</span></div>`;
        else if(kind===1)nums=`<div class="exnums">${fmt(w)}<span class="lt">kg × ${reps}回 × ${sets}set</span></div>`;
        let rpebadge='';
        if(kind===1&&rpe)rpebadge=`<span class="rpe">${rpe}</span>`;
        else if(kind===2)rpebadge=`<span class="rpe">速度${Math.round(pct*100)}%</span>`;
        let actual='';
        if(kind===1){
          const sel=S.actuals[id]||'';
          const opts=FEEL.map(([v,t])=>`<option value="${v}"${v===sel?' selected':''}>${t}</option>`).join('');
          actual=`<div class="actual"><select onchange="setAct('${id}',this.value)">${opts}</select>${recoHtml(sel,rpe)}</div>`;
        }
        const nameHtml=role!=='rest'?`<div class="exname tappable" onclick="openInfo('${role}')">${name}<span class="info">ⓘやり方</span></div>`:`<div class="exname">${name}</div>`;
        body+=`<div class="ex${ck?' done':''}${kind===0?' rest':''}">`+
          (kind===0?`<div class="chk" style="visibility:hidden"></div>`:`<div class="chk" onclick="toggle('${id}')"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></div>`)+
          `<div class="exmain">${nameHtml}${nums}${actual}</div>${rpebadge}</div>`;
      });
      body+=`<div class="memo">${m.acc[d.dt]||''}</div></div>`;
    });
    card.innerHTML=`<div class="wkhead" onclick="toggleWk(${wi})">`+
      `<div class="ttl"><div class="lab">${wk.lab}</div><div class="phase">${wk.ph}</div></div>`+
      `<span class="wkprog${all?' done':''}">${done}/${tot}</span><span class="chev">▶</span></div>`+
      `<div class="wkbody">${body}</div>`;
    app.appendChild(card);
  });
  updateBar();
}

function renderEstAR(wf){
  const est=bestE1RM(wf), ar=arInfo(est);
  const eb=document.getElementById('estbanner');
  if(!est){eb.innerHTML='';}
  else{
    // 高レップ・序盤の推定は誤差が大きいので断定しない
    const early=est.week<6||est.reps>=4, onTrack=est.gap>=0;
    const cls=early?'early':(onTrack?'ok':'bad');
    const verdict=early?'序盤／高レップからの参考値です。判断はW7以降の重い単発で行います。'
      :(onTrack?'目標に到達済みの水準。W12の表示どおり本命を攻めてOK。':`目標まで あと ${fmt(-est.gap)}kg。W12の表示より、下の『推奨試技』を優先してください。`);
    eb.innerHTML=`<div class="estbanner ${cls}"><b>🎯 実測ベース推定1RM ≈ ${fmt(est.e1rm)}kg${early?'（参考）':''}</b><br>`+
      `<span class="sub">根拠: ${esc(est.from)}</span><br>${verdict}</div>`;
  }
  const el=document.getElementById('arbanner');
  if(!ar){el.innerHTML='';return;}
  const sign=ar.percent>0?'+':'';
  el.innerHTML=`<div class="arbanner"><div>📈 実測を反映中　以降の週 <b>${sign}${ar.percent.toFixed(1)}%</b><br>`+
    `<span style="opacity:.8">最終反映 ${ar.weekLabel}${ar.dir?'（'+ar.dir+'）':''}　推定到達 ≈ ${fmt(ar.projected)}kg</span><br>`+
    `<span class="att">推奨試技(実測ベース)　第1 ${fmt(ar.attempts.o)} → 第2 ${fmt(ar.attempts.s)} → 第3 ${fmt(ar.attempts.t)}kg</span></div>`+
    `<button onclick="resetAR()">解除</button></div>`;
}
function renderSched(){
  const el=document.getElementById('sched');
  if(S.mode!=='concurrent'){el.style.display='none';return;}
  el.style.display='block';
  const order=['squat','bench','deadlift'];
  const colJ={squat:'var(--del)',bench:'var(--accent)',deadlift:'var(--acc)'};
  let n=0; const buckets={}; order.forEach(k=>{buckets[k]=S.cfg[k].freq;n+=S.cfg[k].freq;});
  const rr=[]; while(rr.length<n){order.forEach(k=>{if(buckets[k]>0){rr.push(k);buckets[k]--;}});}
  const days=['月','火','水','木','金','土','日'];
  const plan=days.map(()=>[]);
  rr.forEach((k,i)=>{plan[Math.round(i*7/Math.max(n,1))%7].push(k);});
  document.getElementById('schedgrid').innerHTML=days.map((dn,i)=>{
    const cells=plan[i].map(k=>`<span class="pill" style="background:${colJ[k]}">${LIFTMETA[k].short}</span>`).join('');
    return `<div class="d"><div class="dn">${dn}</div>${cells||'<div class="rest">休</div>'}</div>`;
  }).join('');
  const w=document.getElementById('schedwarn');
  let cls,msg;
  if(n<=4){cls='ok';msg=`週${n}セッション。回復に余裕があり継続しやすい配分です。`;}
  else if(n<=6){cls='warn';msg=`週${n}セッション。標準〜やや多め。睡眠・栄養を確保し、腰の疲労が抜けなければ頻度を下げて。`;}
  else{cls='bad';msg=`週${n}セッションは多すぎる傾向。特にデッドの頻度を1回に下げ、スクワットと連日にしないことを推奨します。`;}
  w.className='schedwarn '+cls; w.textContent=msg;
}

    if(l[0]==='rest')return `<div class="titem"><span class="nm">${m.names.rest}</span></div>`;
    const ck=!!S.checks[`${S.lift}_${wi}_${di}_${li}`];
    const nm=l[6]||m.names[l[0]]||l[0], w=weightOf(wi,l,wf);
    const sub=l[5]===3?`${fmt(w)}kg ×${l[2]}`:`${fmt(w)}kg × ${l[2]}×${l[3]}`;
    return `<div class="titem${ck?' dn':''}"><span class="nm">${nm}</span><span class="wt">${sub}</span></div>`;
  }).join('');
  el.onclick=()=>{S.open=wi;save();render();const e2=app.children[wi];if(e2)setTimeout(()=>e2.scrollIntoView({behavior:'smooth',block:'start'}),60);};
  el.innerHTML=`<div class="thead"><span class="tt">${pick.isToday?'今日のメニュー':'次のトレーニング'}</span><span class="tgo">開く ▸</span></div>`+
    `<div class="tsub">${m.short} ｜ ${d.n}</div><div class="tph">${wk.lab}</div>${items}`;
}
function updateBar(){
  let done=0,tot=0;
  TPL.forEach((wk,wi)=>activeDays(wk).forEach(({d,di})=>d.lifts.forEach((l,li)=>{if(l[0]==='rest')return;tot++; if(S.checks[`${S.lift}_${wi}_${di}_${li}`])done++;})));
  const p=tot?Math.round(done/tot*100):0;
  const rf=document.getElementById('ringfill'); if(rf)rf.style.strokeDashoffset=(131.9*(1-p/100)).toFixed(1);
  document.getElementById('pctlabel').textContent=p+'%';
  document.getElementById('countlabel').textContent=done+'/'+tot;
}
function flash(){const t=document.getElementById('savetag'); t.textContent='✓ 保存しました'; t.style.color='var(--ok)';
  clearTimeout(window._ft); window._ft=setTimeout(()=>{t.textContent='✓ 自動保存';t.style.color='';},1200);}

/* ===== Actions ===== */
function switchLift(k){if(S.lift===k)return; S.lift=k; S.open=0; save(); render(); window.scrollTo({top:0,behavior:'smooth'});}
function setMode(m){S.mode=m; save(); render();}
function setFreq(n){cfg().freq=n; save(); flash(); render();}
function setStep(v){if(!PLATE_STEPS.includes(v))return; S.step=v; save(); flash(); render();}
function setWeak(v){const c=cfg(); if(v==='balanced'||!WEAKS.includes(v))delete c.weak; else c.weak=v; save(); flash(); render();}
function resetAR(){
  if(!confirm(LIFTMETA[S.lift].jp+'の実測の記録と自動調整を解除します。よろしいですか？\n※チェック・日付・目標設定は残ります'))return;
  const c=cfg(); c.tmFactor=1; c.lastLog=-1; const pre=S.lift+'_';
  Object.keys(S.actuals).forEach(id=>{if(id.indexOf(pre)===0)delete S.actuals[id];});
  S.adjustments=S.adjustments.filter(a=>a.lift!==S.lift);
  save(); render(); toast('実測の記録と自動調整を解除しました');}
function setCfg(field,v){const n=parseFloat(v);
  if(isNaN(n)){toast('数値を入力してください');render();return;}
  if(n<MINW||n>MAXW){toast(`${MINW}〜${MAXW}kg の範囲で入力してください`);render();return;}
  cfg()[field]=round125(n);
  save(); flash(); render();}
function toggle(id){if(S.checks[id])delete S.checks[id]; else S.checks[id]=true; save(); flash(); render();}
function setDate(k,v){if(v&&DATE_RE.test(v))S.dates[k]=v; else delete S.dates[k]; save(); flash(); render();}
function setAct(id,v){if(v)S.actuals[id]=v; else delete S.actuals[id];
  rebuildTM(S.lift,false); save(); flash(); render();}
function toggleWk(wi){S.open=(S.open===wi?-1:wi); save(); render();
  if(S.open===wi){const el=app.children[wi]; setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),60);}}
function jumpNext(){
  for(let wi=0;wi<TPL.length;wi++){let inc=false;
    activeDays(TPL[wi]).forEach(({d,di})=>d.lifts.forEach((l,li)=>{if(l[0]==='rest')return;if(!S.checks[`${S.lift}_${wi}_${di}_${li}`])inc=true;}));
    if(inc){S.open=wi;save();render();const el=app.children[wi];setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),60);return;}}
  toast(LIFTMETA[S.lift].jp+'の全メニュー完了！お疲れさまでした');
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900);}
async function exportData(){
  const data=JSON.stringify(S,null,2);
  const fname='big3_backup_'+todayStr()+'.json';
  try{
    const file=new File([data],fname,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'BIG3 FORGE バックアップ'});
      toast('共有先に保存しました'); return;
    }
  }catch(e){ if(e&&e.name==='AbortError')return; }
  try{
    const blob=new Blob([data],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;
    document.body.appendChild(a);a.click();a.remove();toast('ファイルに書き出しました');
  }catch(e){toast('書き出しに失敗しました');}
}

/* ===== 復元（iOS版のバックアップ／Web版のバックアップ） ===== */
let pendingRestore=null;
function openRestore(){
  pendingRestore=null;
  sheetShow(`<h3>バックアップを読み込む</h3>`+
    `<div class="diff">iOS版の「バックアップを書き出し」→「コピー」した内容を貼り付けるか、保存したファイルを選んでください。</div>`+
    `<textarea id="restoretxt" class="restoretxt" placeholder='{"version":2,"cfg":{...}}' autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>`+
    `<div class="rrow"><button class="tbtn" onclick="document.getElementById('file').click()">ファイルを選ぶ</button>`+
    `<button class="tbtn go" onclick="previewRestore()">内容を確認</button></div><div id="restoreprev"></div>`);
}
function importFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=e=>{const ta=document.getElementById('restoretxt');if(!ta)openRestore();
    document.getElementById('restoretxt').value=String(e.target.result||'');previewRestore();};
  r.onerror=()=>toast('ファイルを読み込めませんでした');
  r.readAsText(f);inp.value='';}
function previewRestore(){
  const out=document.getElementById('restoreprev'); pendingRestore=null;
  const txt=(document.getElementById('restoretxt').value||'').trim();
  if(!txt){out.innerHTML=`<div class="box warn">貼り付けるか、ファイルを選んでください。</div>`;return;}
  let raw; try{raw=JSON.parse(txt);}catch(e){out.innerHTML=`<div class="box warn">読み込めません。JSONの一部が欠けている可能性があります（全文をコピーしてください）。</div>`;return;}
  if(!isObj(raw)||!isObj(raw.cfg)){out.innerHTML=`<div class="box warn">BIG3 FORGEのバックアップではないようです。</div>`;return;}
  const st=sanitize(raw);
  const rows=LIFTS.map(k=>{
    const pre=k+'_', cnt=o=>Object.keys(o).filter(id=>id.indexOf(pre)===0).length;
    let lastW=-1; Object.keys(st.checks).forEach(id=>{if(id.indexOf(pre)===0)lastW=Math.max(lastW,+id.split('_')[1]);});
    const c=st.cfg[k];
    return `<tr><td>${LIFTMETA[k].short}</td><td>${fmt(c.cur)}→${fmt(c.tgt)}</td><td>${lastW>=0?'W'+(lastW+1):'—'}</td><td>${cnt(st.checks)}</td><td>${cnt(st.actuals)}</td></tr>`;
  }).join('');
  pendingRestore=st;
  out.innerHTML=`<h4>読み込む内容</h4><table class="rtable"><tr><th>種目</th><th>現在→目標</th><th>最終チェック</th><th>チェック</th><th>実測</th></tr>${rows}</table>`+
    `<div class="diff">このブラウザに保存されている記録は上書きされます。補正係数は読み込み後に現行の計算で計算し直します。</div>`+
    `<button class="tbtn go wide" onclick="applyRestore()">この内容で上書きする</button>`;
}
function applyRestore(){
  if(!pendingRestore)return;
  S=pendingRestore; pendingRestore=null;
  LIFTS.forEach(k=>rebuildTM(k,false));
  const nx=todayPick(); if(nx)S.open=nx.wi;
  save(); closeSheet(); render(); toast('読み込みました');
  const el=app.children[S.open]; if(el)setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),120);
}
function resetAll(){if(confirm('現在の種目('+LIFTMETA[S.lift].jp+')の日付・チェック・実測・自動調整を消去します。よろしいですか？\n※目標設定と他種目は残ります')){
  const pre=S.lift+'_';
  ['checks','dates','actuals'].forEach(k=>{Object.keys(S[k]).forEach(id=>{if(id.indexOf(pre)===0)delete S[k][id];});});
  S.adjustments=S.adjustments.filter(a=>a.lift!==S.lift);
  cfg().tmFactor=1; cfg().lastLog=-1;
  save();render();toast('リセットしました');}}
render();
</script>
